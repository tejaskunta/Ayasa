# Render blueprint — hosts ONLY the model-service (FastAPI).
# The API server and client deploy on Vercel (see docs/DEPLOYMENT.md).
#
# Note on the image: BOTH Dockerfiles here currently install only the lean
# requirements.txt. The torch stack lives in requirements-ml.txt (~2 GB) and is
# optional — it will not fit Render's 512 MB free tier, so we run rules_only
# analysis + Groq warmth, which is the verified production path. Dockerfile.fat
# is referenced to match the deploy checklist; it is functionally identical today.
services:
  - type: web
    name: ayasa-model-service
    runtime: docker
    region: oregon
    plan: free
    rootDir: model-service
    dockerfilePath: ./Dockerfile.fat
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # paste your (regenerated) Groq key in the dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b   # repo default llama-3.1-8b-instant 404s on this account
      - key: ENABLE_HF_MODELS
        value: "false"
      - key: HF_TOKEN
        sync: false        # optional; only needed if ENABLE_HF_MODELS is ever true

